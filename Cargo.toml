[workspace]
resolver = "3"
members = ["kernel", "crates/vibe-font", "crates/vibe-gfx", "crates/vibe-keyboard", "tools/vibe-run"]
# ルートで cargo build / cargo test したときはホスト向けのものだけを対象にする。
# kernel は kernel/ に入って（Makefile 経由で）ビルドする。
default-members = ["crates/vibe-font", "crates/vibe-gfx", "crates/vibe-keyboard", "tools/vibe-run"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
debug = true
