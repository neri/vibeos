[workspace]
resolver = "3"
members = [
    "kernel",
    "apps/vibe-rt",
    "apps/hello",
    "apps/fault",
    "apps/view",
    "apps/paint",
    "apps/mandel",
    "apps/snake",
    "apps/more",
    "apps/fstest",
    "apps/edit",
    "apps/clock",
    "apps/life",
    "apps/ping",
    "apps/host",
    "apps/ntp",
    "apps/get",
    "apps/httpd",
    "apps/calc",
    "apps/files",
    "crates/vibe-abi",
    "crates/vibe-alloc",
    "crates/vibe-calc",
    "crates/vibe-edit",
    "crates/vibe-fat",
    "crates/vibe-files",
    "crates/vibe-font",
    "crates/vibe-gfx",
    "crates/vibe-keyboard",
    "crates/vibe-lzsa",
    "crates/vibe-net",
    "crates/vibe-pack",
    "crates/vibe-term",
    "crates/vibe-time",
    "crates/vibe-ui",
    "tools/mkassets",
    "tools/vibe-lzsa",
    "tools/vibe-run",
]
# ルートで cargo build / cargo test したときはホスト向けのものだけを対象にする。
# kernel は kernel/ に入って（Makefile 経由で）ビルドする。
default-members = [
    "crates/vibe-abi",
    "crates/vibe-alloc",
    "crates/vibe-calc",
    "crates/vibe-edit",
    "crates/vibe-fat",
    "crates/vibe-files",
    "crates/vibe-font",
    "crates/vibe-gfx",
    "crates/vibe-keyboard",
    "crates/vibe-lzsa",
    "crates/vibe-net",
    "crates/vibe-pack",
    "crates/vibe-term",
    "crates/vibe-time",
    "crates/vibe-ui",
    "tools/mkassets",
    "tools/vibe-lzsa",
    "tools/vibe-run",
]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
debug = true

# 圧縮器のテストは大きなデータを最適パースするので、テスト（dev）でも最適化する
[profile.dev.package.vibe-lzsa]
opt-level = 3
