# apps/ の中で cargo を実行したときだけ効く設定（ユーザアプリ用）
[build]
target = "../targets/i486-vibeos.json"
target-dir = "../target/apps"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.i486-vibeos]
# -n（nmagic）: ファイルの中でセグメントをページの境目にそろえない（詰め物の 0 が無くなる。カーネルは
# セグメントを番地へ写すだけなので、ファイルの位置と番地がページの中でそろっている必要は無い）
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-n"]
