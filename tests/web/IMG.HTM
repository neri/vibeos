<html><head><title>Images</title></head>
<body>
<h1>Images</h1>
<p>A PNG <img src="LOGO.PNG" alt="logo"> and a BMP <img src="TILE.BMP" alt="tile"> in a line.</p>
<p>The same PNG made wider: <img src="LOGO.PNG" width="96" alt="wide logo"></p>
<p><a href="LOGO.PNG"><img src="TILE.BMP" alt="link"></a> is a link to the PNG.</p>
<p>Missing <img src="NOPE.PNG" alt="missing"> and broken <img src="BAD.PNG" alt="broken"> images keep their text.</p>
</body></html>
