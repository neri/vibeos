[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kernel"
test = false
bench = false

[features]
# QEMU でのテスト用ビルド: isa-debug-exit で終了コードを返す（実機では使わない）
qemu-test = []

[dependencies]
xmas-elf = "0.10"
vibe-abi = { path = "../crates/vibe-abi" }
vibe-alloc = { path = "../crates/vibe-alloc" }
vibe-fat = { path = "../crates/vibe-fat" }
vibe-font = { path = "../crates/vibe-font" }
vibe-gfx = { path = "../crates/vibe-gfx" }
vibe-keyboard = { path = "../crates/vibe-keyboard" }
vibe-term = { path = "../crates/vibe-term" }
vibe-net = { path = "../crates/vibe-net" }
vibe-shell = { path = "../crates/vibe-shell" }
vibe-time = { path = "../crates/vibe-time" }
# アプリ（gzip）の展開。ktest は KERNEL.SYS（LZSA2）の展開にも使う
vibe-pack = { path = "../crates/vibe-pack", default-features = false, features = ["gzip"] }

# ktest のデータ（ホストで圧縮した LZSA2）を作るため
[build-dependencies]
vibe-lzsa = { path = "../crates/vibe-lzsa" }
vibe-pack = { path = "../crates/vibe-pack" }
