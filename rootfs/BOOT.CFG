# VibeOS boot settings. Edit and sync, then reboot.
# video=auto: the largest 32-bit screen that fits the memory and the monitor
#   (up to 1024x768 if the monitor does not tell its size)
# video=WxH: the largest 32-bit screen up to WxH (e.g. video=1920x1080)
# video=320x200: the retro screen (also used when there is no 32-bit screen;
#   hold Shift while booting to use it once)
video=auto
# Network card: net=auto (PCI RTL8139/NE2000, else ISA NE2000 at 0x300 IRQ 10),
# net=ne2000,IO,IRQ (ISA), or net=none
net=auto
# Address: ip=dhcp, or a fixed one: ip=10.0.2.15/24 (with gw=, dns=)
ip=dhcp
# dns=10.0.2.3
# ntp=10.0.2.2
# Time zone of the PC clock (ntp adds it to UTC)
tz=+09:00
# Desktop background (BMP): wallpaper=/IMAGES/PLASMA.BMP tile (or center)
